<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clasificador de Café - Lógica Difusa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #2980b9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2471a3;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Clasificador de Café</h1>
    <form method="POST" action="/clasificar">
      <label for="ph">Acidez (pH 4.85 – 5.10):</label>
      <input type="number" step="0.01" name="ph" id="ph" required>

      <label for="cafeina">Contenido de Cafeína (1.0 – 2.5 %):</label>
      <input type="number" step="0.01" name="cafeina" id="cafeina" required>

      <label for="humedad">Humedad (10 – 12 %):</label>
      <input type="number" step="0.01" name="humedad" id="humedad" required>

      <label for="aroma">Aroma (1 – 10):</label>
      <input type="number" step="1" name="aroma" id="aroma" required>

      <button type="submit">Clasificar</button>
    </form>

    {% if resultado %}
    <div class="result">
      ➡️ Clasificación: {{ resultado }}
    </div>
    {% endif %}
  </div>
</body>
</html>
